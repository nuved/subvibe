# SubVibe community tips — origin vhost for tips.nimanou.com (copy of service/community-tips/deploy/nginx-tips.conf
# in the subvibe repo; lives untracked in /opt/sprachbrucke/nginx/conf.d like nginx-tunnel.conf).
# Cloudflare Origin cert for tips.nimanou.com; only Cloudflare's edge may connect ($cf_edge from cloudflare-allow.conf).
server {
    listen 80;
    listen [::]:80;
    server_name tips.nimanou.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tips.nimanou.com;
    ssl_certificate     /etc/nginx/certs/tips.nimanou.com.crt;
    ssl_certificate_key /etc/nginx/certs/tips.nimanou.com.key;
    if ($cf_edge = 0) { return 403; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 32k;
    location / {
        set $tips "subvibe-tips:8080";
        proxy_pass http://$tips;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
