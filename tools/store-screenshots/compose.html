<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Store screenshot composer</title>
<!--
  Renders ONE 1280×800 Chrome Web Store screenshot per popup tab.
  Open with ?tab=translate | dub | style, viewport exactly 1280×800, screenshot,
  then downscale the retina capture to 1280×800 (see README.md).
-->
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1280px; height: 800px; overflow: hidden; display: flex; align-items: center;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color: #e7ecf3;
    background: #0b0d12 radial-gradient(circle at 78% 55%, #10261f 0%, #0b1712 38%, #0b0d12 75%); }
  .left { flex: 1; padding: 0 40px 0 84px; }
  .mark { font-size: 22px; font-weight: 800; letter-spacing: .3px; color: #4f8cff; margin-bottom: 26px; }
  h1 { font-size: 46px; line-height: 1.16; font-weight: 800; margin-bottom: 30px; max-width: 560px; }
  li { list-style: none; font-size: 21px; color: #b8c2d1; margin: 15px 0; padding-left: 26px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: #7fe0b0; }
  .right { flex: none; width: 470px; display: flex; justify-content: center; }
  .frame { width: 344px; height: 676px; overflow: hidden; border-radius: 14px; border: 2px solid #28303d;
    box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(127,224,176,.08); background: #0b0d12; }
  .frame img { width: 500px; height: auto; margin: 2px 0 0 2px; display: block; } /* crop the 500px viewport to the 340px popup */
</style>
</head>
<body>
  <div class="left">
    <div class="mark">SubVibe</div>
    <h1 id="h"></h1>
    <ul id="b"></ul>
  </div>
  <div class="right"><div class="frame"><img id="shot" alt=""></div></div>
  <script>
    const TABS = {
      translate: { h: "AI subtitles in your language — in sync", b: [
        "Pre-translated ahead of the playhead, never lagging",
        "OpenAI or Claude — your key, your choice of model",
        "Watched once? Replays are cached and free" ] },
      dub: { h: "Or let SubVibe speak it for you", b: [
        "AI voices read the translation over the ducked original",
        "One voice per speaker, adjustable pace and volume",
        "Full-video dubs with the cost shown before you pay" ] },
      style: { h: "Subtitles that look the way you want", b: [
        "Presets from Classic to Cinema to Pill",
        "Custom font, color, background and outline",
        "Size and position remembered per video" ] },
    };
    const tab = new URLSearchParams(location.search).get("tab") || "translate";
    document.getElementById("h").textContent = TABS[tab].h;
    document.getElementById("b").innerHTML = TABS[tab].b.map((t) => "<li>" + t + "</li>").join("");
    document.getElementById("shot").src = "shots/raw-" + tab + ".png";
  </script>
</body>
</html>
