<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Small promo tile — 440×280 (designed at 2×: 880×560)</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  @font-face { font-family: "Baloo 2"; font-weight: 800;
    src: url("../../fonts/Baloo2-ExtraBold-latin.woff2") format("woff2"); }
  body { width: 880px; height: 560px; overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color: #241F1A;
    background: #FAF6F0 radial-gradient(circle at 50% 30%, #FDE8E4 0%, #F7EFE5 45%, #FAF6F0 80%); }
  .head { display: flex; align-items: center; gap: 20px; }
  .head img { width: 84px; height: 84px; border-radius: 20px; }
  .head span { font-family: "Baloo 2"; font-size: 64px; font-weight: 800; letter-spacing: .5px; }
  .tag { font-size: 27px; color: #5B5348; }
  /* the brand motif: a real-look caption with the karaoke sweep */
  .cap { font-size: 30px; font-weight: 600; color: #fff; background: rgba(8, 10, 14, .82);
    padding: 8px 22px; border-radius: 12px; text-shadow: 0 2px 6px rgba(0, 0, 0, .9); }
  .cap b { color: #ffd479; font-weight: 600; }
</style>
</head>
<body>
  <div class="head"><img src="../../icons/icon-128.png?daylight=1" alt=""><span>SubVibe</span></div>
  <div class="tag">AI subtitles in your language — in sync, cached free</div>
  <div class="cap"><b>Every video speaks</b> your language</div>
</body>
</html>
