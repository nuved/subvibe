<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Marquee promo tile — 1400×560</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1400px; height: 560px; overflow: hidden; display: flex; align-items: center;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color: #e7ecf3;
    background: #0b0d12 radial-gradient(circle at 74% 60%, #10261f 0%, #0b1712 42%, #0b0d12 78%); }
  .left { flex: 1; padding-left: 90px; }
  .head { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
  .head img { width: 64px; height: 64px; border-radius: 16px; }
  .head span { font-size: 52px; font-weight: 800; letter-spacing: .4px; }
  h1 { font-size: 40px; font-weight: 800; line-height: 1.2; max-width: 560px; margin-bottom: 18px; }
  .tag { font-size: 22px; color: #b8c2d1; max-width: 560px; }
  .chips { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; max-width: 600px; }
  .chip { font-size: 16px; color: #b8c2d1; border: 1px solid #28303d; border-radius: 999px; padding: 6px 14px; background: rgba(17, 21, 28, .6); }
  .right { flex: none; width: 620px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-right: 60px; }
  .cap { font-weight: 600; color: #fff; background: rgba(8, 10, 14, .82); padding: 8px 24px; border-radius: 10px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, .9); }
  .de { font-size: 30px; }
  .fa { font-size: 32px; direction: rtl; }
  .cap b { color: #ffd479; font-weight: 600; }
</style>
</head>
<body>
  <div class="left">
    <div class="head"><img src="../../icons/icon-128.png" alt=""><span>SubVibe</span></div>
    <h1>Watch anything in your language</h1>
    <div class="tag">AI-translated subtitles with karaoke highlight — and voices that speak the translation. Your API key, your device, no servers.</div>
    <div class="chips"><span class="chip">YouTube</span><span class="chip">Netflix</span><span class="chip">Prime Video</span><span class="chip">ZDF</span><span class="chip">DW</span><span class="chip">Udemy</span></div>
  </div>
  <div class="right">
    <div class="cap de"><b>Ich habe eine gute</b> Idee — hör zu!</div>
    <div class="cap fa"><b>من یک ایدهٔ</b> خوب دارم — گوش کن!</div>
  </div>
</body>
</html>
